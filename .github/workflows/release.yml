name: Build & Release

# Triggers when you push a version tag like v1.0.0 or v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Windows installer (.exe) ─────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:server && npm run build:client

      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run publish:win

  # ── macOS installer (.dmg) ───────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:server && npm run build:client

      - name: Build & publish macOS installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run publish:mac
