name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Windows installer (.exe) ─────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build server bundle
        run: npx esbuild server/index.ts --bundle --platform=node --target=node18 --outfile=dist/server/index.js --external:better-sqlite3 --external:electron

      - name: Build client bundle
        run: npx vite build --outDir dist/client

      - name: Verify dist structure
        run: |
          echo "=== dist/ contents ==="
          dir dist
          echo "=== dist/server/ contents ==="
          dir dist\server
          echo "=== dist/client/ contents ==="
          dir dist\client
        shell: cmd

      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win --publish always

  # ── macOS installer (.dmg) ───────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build server bundle
        run: npx esbuild server/index.ts --bundle --platform=node --target=node18 --outfile=dist/server/index.js --external:better-sqlite3 --external:electron

      - name: Build client bundle
        run: npx vite build --outDir dist/client

      - name: Verify dist structure
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== dist/server/ contents ==="
          ls -la dist/server/
          echo "=== dist/client/ contents ==="
          ls -la dist/client/

      - name: Build & publish macOS installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --mac --publish always
